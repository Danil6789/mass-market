[versions]
# Spring stack
spring-boot = "3.2.5"
spring-cloud = "2023.0.3"

# Kafka
spring-kafka = "3.1.4"

# Persistence
postgresql = "42.7.3"
flyway = "9.22.3"

# JWT
jjwt = "0.12.6"

# Mapping / Lombok
mapstruct = "1.5.5.Final"
lombok-mapstruct-binding = "0.2.0"
lombok = "1.18.30"

# Resilience
resilience4j = "2.2.0"

# API documentation
springdoc-openapi = "2.3.0"

# Tracing / Observability
micrometer-tracing = "1.2.5"

# Test
testcontainers = "1.19.7"

# Plugins
spring-boot-plugin = "3.2.5"
spring-dependency-management-plugin = "1.1.4"


[libraries]
# Spring Boot starters
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "spring-boot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring-boot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring-boot" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail", version.ref = "spring-boot" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }

# Spring Cloud
spring-cloud-starter-netflix-eureka-server = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server", version.ref = "spring-cloud" }
spring-cloud-starter-netflix-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client", version.ref = "spring-cloud" }
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway", version.ref = "spring-cloud" }
spring-cloud-starter-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign", version.ref = "spring-cloud" }

# Kafka
spring-kafka = { module = "org.springframework.kafka:spring-kafka", version.ref = "spring-kafka" }

# Persistence
postgresql-driver = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# JWT
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# Mapping
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Resilience4j
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
resilience4j-reactor = { module = "io.github.resilience4j:resilience4j-reactor", version.ref = "resilience4j" }

# SpringDoc OpenAPI
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }
springdoc-openapi-starter-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc-openapi" }

# Tracing / Observability
micrometer-tracing-bridge-brave = { module = "io.micrometer:micrometer-tracing-bridge-brave", version.ref = "micrometer-tracing" }
zipkin-reporter-brave = { module = "io.zipkin.reporter2:zipkin-reporter-brave", version.ref = "micrometer-tracing" }

# Testcontainers BOM and modules
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:kafka", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }


[bundles]
# Bundles for convenience
spring-boot-web = ["spring-boot-starter-web", "spring-boot-starter-validation"]
spring-boot-webflux = ["spring-boot-starter-webflux", "spring-boot-starter-validation"]
spring-boot-persistence = ["spring-boot-starter-data-jpa", "postgresql-driver", "flyway-core", "flyway-database-postgresql"]
spring-boot-security = ["spring-boot-starter-security"]
spring-boot-actuator = ["spring-boot-starter-actuator"]
spring-boot-mail = ["spring-boot-starter-mail", "spring-boot-starter-thymeleaf"]
jjwt = ["jjwt-api", "jjwt-impl", "jjwt-jackson"]
mapstruct-bundle = ["mapstruct", "lombok-mapstruct-binding"]
resilience4j = ["resilience4j-spring-boot3", "resilience4j-reactor"]
tracing = ["micrometer-tracing-bridge-brave", "zipkin-reporter-brave"]
springdoc-webmvc = ["springdoc-openapi-starter-webmvc-ui"]
springdoc-webflux = ["springdoc-openapi-starter-webflux-ui"]
testcontainers-bundle = ["testcontainers-postgresql", "testcontainers-kafka", "testcontainers-junit-jupiter"]


[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot-plugin" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management-plugin" }
