# docker-compose.yml — Full stack (7 microservices + infra via include)
#
# The infrastructure (postgres×5, kafka, mailhog, zipkin) is defined in
# docker-compose.infra.yml and pulled in here via the `include` directive
# (Compose v2.20+). This way a single `docker compose up -d` brings up
# everything.
#
# Bring up:   docker compose up -d
# Tear down:  docker compose down -v
#
# Note: each microservice runs in this stack as `marketplace/<name>:latest`.
# Build context is the repo root, so the Dockerfiles can COPY common/ etc.

include:
  - path: ./docker-compose.infra.yml

services:

  # ============================================
  # Eureka — service discovery (must start first)
  # ============================================

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: marketplace/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============================================
  # API Gateway — single entry point for clients
  # ============================================

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: marketplace/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      ADMIN_SERVICE_URL: http://admin-service:8085
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================
  # Business services
  # ============================================

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: marketplace/user-service:latest
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      POSTGRES_HOST: postgres-user
      POSTGRES_PORT: 5432
      POSTGRES_DB: user_db
      POSTGRES_USER: user_svc
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD:-user_pwd}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-min-32-chars-long-secret-key-please}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    image: marketplace/product-service:latest
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      POSTGRES_HOST: postgres-product
      POSTGRES_PORT: 5432
      POSTGRES_DB: product_db
      POSTGRES_USER: product_svc
      POSTGRES_PASSWORD: ${POSTGRES_PRODUCT_PASSWORD:-product_pwd}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-min-32-chars-long-secret-key-please}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    volumes:
      # product-service image uploads (bind mount so files persist on host)
      - ./uploads/products:/var/lib/marketplace/uploads/products
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: marketplace/order-service:latest
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      POSTGRES_HOST: postgres-order
      POSTGRES_PORT: 5432
      POSTGRES_DB: order_db
      POSTGRES_USER: order_svc
      POSTGRES_PASSWORD: ${POSTGRES_ORDER_PASSWORD:-order_pwd}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-min-32-chars-long-secret-key-please}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    image: marketplace/notification-service:latest
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      POSTGRES_HOST: postgres-notification
      POSTGRES_PORT: 5432
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_svc
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD:-notification_pwd}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-min-32-chars-long-secret-key-please}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: 1025
      USER_SERVICE_URL: http://user-service:8081
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    image: marketplace/admin-service:latest
    container_name: admin-service
    ports:
      - "8085:8085"
    environment:
      POSTGRES_HOST: postgres-admin
      POSTGRES_PORT: 5432
      POSTGRES_DB: admin_db
      POSTGRES_USER: admin_svc
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin_pwd}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-min-32-chars-long-secret-key-please}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped


networks:
  marketplace-net:
    driver: bridge
